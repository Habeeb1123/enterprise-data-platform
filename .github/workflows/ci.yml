name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: datacareer_db
          POSTGRES_USER: datacareer_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U datacareer_user -d datacareer_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: datacareer_db
      DB_USER: datacareer_user
      DB_PASSWORD: test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create database table
        run: |
          PGPASSWORD=test_password psql \
            -h localhost \
            -U datacareer_user \
            -d datacareer_db \
            -f sql/create_weather_table.sql

      - name: Run ingestion
        run: python -m src.ingestion.api_ingestion

      - name: Run transformation
        run: python -m src.transformation.clean_data

      - name: Load PostgreSQL
        run: python -m src.database.load_postgres

      - name: Run automated tests
        run: python -m pytest tests -v